# .github/workflows/ci.yml — CI/CD pipeline for ALO English Test Platform.
#
# Quality gates (all must pass before a deployment artifact is created):
#   1. Clean dependency installation
#   2. Prisma client generation
#   3. Lint
#   4. Typecheck
#   5. Smoke tests
#   6. Production build
#   7. Helper script syntax validation (bash -n)
#   8. Archive verification + checksum

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  BUN_VERSION: "1.3"

jobs:
  # ─── Quality gates ────────────────────────────────────────────────────
  verify:
    name: Verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Preflight: a malformed manifest or a missing lockfile makes
      # `bun install --frozen-lockfile` fail with a generic "exit code 1" and
      # every later step is skipped. Name the actual problem first.
      - name: Validate package manifest
        run: node scripts/check-manifest.mjs

      # CI provisions its database with `prisma db push` (built from the
      # schema), while production provisions with `prisma migrate deploy`
      # (replays prisma/migrations). Those two can disagree, and when they do
      # CI is green while the production database is missing tables. Needs no
      # Prisma engine and no database.
      - name: Verify schema/migration parity
        run: node scripts/check-schema-migrations.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # The suite includes database-backed tests (RBAC, attempt engine).
      # They run against a real migrated + seeded SQLite database rather than
      # being skipped: provision the database, then run everything.
      # Provision the way production does. Hostinger runs `prisma migrate
      # deploy`; using `db push` here builds the schema straight from
      # schema.prisma and hides any gap in prisma/migrations — which is exactly
      # how 17 tables went missing while CI stayed green.
      #
      # These are separate steps so a failure names the command that failed
      # instead of hiding inside one three-line block.
      - name: Provision test database (migrate deploy)
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci-test.db"

      - name: Seed core data
        run: |
          set +e
          out=$(bun run prisma:seed 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            # Re-emit the tail as annotations so the cause is visible in the
            # job summary and the checks API, not only in the raw log.
            echo "$out" | tail -25 | sed 's/^/::error ::seed core data: /'
            exit "$code"
          fi
        env:
          DATABASE_URL: "file:./ci-test.db"
          ADMIN_SEED_EMAIL: "ci-admin@test.local"
          ADMIN_SEED_PASSWORD: "ci-test-password-not-a-real-secret"

      - name: Seed RBAC
        run: |
          set +e
          out=$(bun run prisma:seed:rbac 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "$out" | tail -25 | sed 's/^/::error ::seed rbac: /'
            exit "$code"
          fi
        env:
          DATABASE_URL: "file:./ci-test.db"
          ADMIN_SEED_EMAIL: "ci-admin@test.local"
          ADMIN_SEED_PASSWORD: "ci-test-password-not-a-real-secret"

      # Content integrity: every selectable objective question must be
      # gradeable, and listening questions without audio are reported. This is
      # the gate `postbuild` deliberately does not enforce (a content gap must
      # not take production down), so CI is where it is binding.
      - name: Validate question content
        run: npm run content:validate
        env:
          DATABASE_URL: "file:./ci-test.db"

      # Every suite runs against the database provisioned above, including the
      # database-backed RBAC and attempt-engine tests. No suite is skipped.
      #
      # Suites are separate steps so a red build names the exact file. Each
      # records its own exit code; the gate step below fails the job if any
      # code is non-zero, so continue-on-error buys diagnosability only and
      # can never produce a green build.
      - name: Tests — smoke (no database)
        continue-on-error: true
        run: |
          set +e
          bun test tests/smoke.test.ts --timeout 30000 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          grep -E "^\(fail\)" smoke.log | head -15 | sed 's/^/::error ::smoke /'
          echo "smoke=$code" >> test-results.txt

      - name: Tests — exam engine (no database)
        continue-on-error: true
        run: |
          set +e
          bun test tests/exam-engine.test.ts --timeout 30000 2>&1 | tee engine.log
          code=${PIPESTATUS[0]}
          grep -E "^\(fail\)" engine.log | head -15 | sed 's/^/::error ::engine /'
          echo "engine=$code" >> test-results.txt

      - name: Tests — RBAC (database)
        continue-on-error: true
        run: |
          set +e
          bun test tests/rbac.test.ts --timeout 30000 2>&1 | tee rbac.log
          code=${PIPESTATUS[0]}
          grep -E "^\(fail\)" rbac.log | head -15 | sed 's/^/::error ::rbac /'
          echo "rbac=$code" >> test-results.txt
        env:
          DATABASE_URL: "file:./ci-test.db"

      - name: Tests — attempt engine (database)
        continue-on-error: true
        run: |
          set +e
          bun test tests/exam-attempt.test.ts --timeout 30000 2>&1 | tee attempt.log
          code=${PIPESTATUS[0]}
          grep -E "^\(fail\)" attempt.log | head -15 | sed 's/^/::error ::attempt /'
          echo "attempt=$code" >> test-results.txt
        env:
          DATABASE_URL: "file:./ci-test.db"

      # The gate compares what ran against what was supposed to run. Three
      # failure shapes are all reported explicitly:
      #   - the ledger is absent, meaning an earlier step failed or was skipped
      #     and no suite ran at all (this used to crash on `cat` and hide the
      #     real cause behind "No such file or directory"),
      #   - a suite is missing from the ledger, meaning it never executed,
      #   - a suite recorded a non-zero exit code.
      # A suite that silently did not run can therefore never look green.
      - name: Verify every suite passed
        if: always()
        env:
          EXPECTED_SUITES: "smoke engine rbac attempt"
        run: |
          if [ ! -f test-results.txt ]; then
            echo "::error ::no test suite ran: test-results.txt was never created. An earlier step failed or was skipped — see the first failing step above."
            exit 1
          fi

          echo "Recorded results:"
          cat test-results.txt

          status=0
          ran=0
          for suite in $EXPECTED_SUITES; do
            line=$(grep -E "^${suite}=" test-results.txt | tail -1 || true)
            if [ -z "$line" ]; then
              echo "::error ::test suite did not run: $suite"
              status=1
            elif [ "$line" != "${suite}=0" ]; then
              echo "::error ::test suite failed: ${suite} (exit ${line#${suite}=})"
              status=1
            else
              ran=$((ran + 1))
            fi
          done

          # Anything recorded that is not in the expected list means the suite
          # list above is stale — fail rather than ignore untracked results.
          while IFS='=' read -r name code; do
            [ -z "$name" ] && continue
            case " $EXPECTED_SUITES " in
              *" $name "*) ;;
              *) echo "::error ::unexpected suite in ledger: $name (expected: $EXPECTED_SUITES)"
                 status=1 ;;
            esac
          done < test-results.txt

          [ "$status" -eq 0 ] || exit 1
          echo "All test suites passed ($ran/$ran green)."

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file::memory:?cache=shared"
          AUTH_SECRET: "ci-test-secret-not-for-production-use-32chars"

      - name: Verify build output
        run: |
          test -f .next/standalone/server.js || { echo "Build output missing"; exit 1; }
          echo "✓ Build output verified"

  # ─── Script validation ───────────────────────────────────────────────
  scripts:
    name: Script syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bash scripts
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script…"
            bash -n "$script" || { echo "Syntax error in $script"; exit 1; }
          done
          echo "✓ All scripts pass syntax validation"

      - name: Validate systemd service
        run: |
          if command -v systemd-analyze &>/dev/null; then
            systemd-analyze verify server-config/alo-english.service || true
          else
            echo "systemd-analyze not available (non-systemd runner) — skipping"
          fi

      - name: Validate sudoers policy
        run: |
          if command -v visudo &>/dev/null; then
            visudo -c -f server-config/sudo-policy || { echo "Invalid sudoers policy"; exit 1; }
          else
            echo "visudo not available — skipping"
          fi

  # ─── Deployment artifact ─────────────────────────────────────────────
  package:
    name: Create deployment artifact
    needs: [verify, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          mkdir -p dist
          tar -czf dist/alo-english-source.tar.gz \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='*.log' \
            --exclude='*.db' \
            --exclude='.env' \
            --exclude='cpanel-production' \
            --exclude='english-aloeducation' \
            --exclude='skills' \
            --exclude='mini-services' \
            --exclude='examples' \
            --exclude='tool-results' \
            --exclude='upload' \
            --exclude='download' \
            src/ prisma/ public/ scripts/ server-config/ tests/ \
            package.json bun.lock tsconfig.json next.config.ts \
            .env.example .gitignore \
            README.md DEPLOYMENT.md OPERATIONS.md TROUBLESHOOTING.md SECURITY.md CHANGELOG.md

      - name: Generate checksum
        run: |
          cd dist
          sha256sum alo-english-source.tar.gz > alo-english-source.tar.gz.sha256
          cat alo-english-source.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alo-english-source
          path: dist/
          retention-days: 30
