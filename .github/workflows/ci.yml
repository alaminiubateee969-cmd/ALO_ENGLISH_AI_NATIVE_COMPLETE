# .github/workflows/ci.yml — CI/CD pipeline for ALO English Test Platform.
#
# Quality gates (all must pass before a deployment artifact is created):
#   1. Clean dependency installation
#   2. Prisma client generation
#   3. Lint
#   4. Typecheck
#   5. Smoke tests
#   6. Production build
#   7. Helper script syntax validation (bash -n)
#   8. Archive verification + checksum
#   9. Host-parity build — the host's exact npm pipeline, then boot the artifact
#
# Jobs 1-8 run under bun, which is how development and CI run. The host runs
# npm, and runs only `npm install` followed by `npm run build`. Job 9 reproduces
# that command for command; without it, CI can be green on a commit the host
# cannot deploy.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  BUN_VERSION: "1.3"

jobs:
  # ─── Quality gates ────────────────────────────────────────────────────
  verify:
    name: Verify (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Preflight: a malformed manifest or a missing lockfile makes
      # `bun install --frozen-lockfile` fail with a generic "exit code 1" and
      # every later step is skipped. Name the actual problem first.
      - name: Validate package manifest
        run: node scripts/check-manifest.mjs

      # CI provisions its database with `prisma db push` (built from the
      # schema), while production provisions with `prisma migrate deploy`
      # (replays prisma/migrations). Those two can disagree, and when they do
      # CI is green while the production database is missing tables. Needs no
      # Prisma engine and no database.
      - name: Verify schema/migration parity
        run: node scripts/check-schema-migrations.mjs

      # The four root inventory CSVs are generated from source. They were
      # hand-written once and then drifted — 25 models against 44 in the schema,
      # 51 endpoints against 73 route files. --check regenerates in memory and
      # fails if what is committed differs, so they cannot drift again.
      - name: Verify inventories match source
        run: node scripts/generate-inventories.mjs --check

      - name: Verify the project index matches source
        run: node scripts/generate-project-index.mjs --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # The suite includes database-backed tests (RBAC, attempt engine).
      # They run against a real migrated + seeded SQLite database rather than
      # being skipped: provision the database, then run everything.
      # Provision the way production does. Hostinger runs `prisma migrate
      # deploy`; using `db push` here builds the schema straight from
      # schema.prisma and hides any gap in prisma/migrations — which is exactly
      # how 17 tables went missing while CI stayed green.
      #
      # These are separate steps so a failure names the command that failed
      # instead of hiding inside one three-line block.
      - name: Provision test database (migrate deploy)
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci-test.db"

      - name: Seed core data
        run: |
          set +e
          out=$(bun run prisma:seed 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            # Re-emit the tail as annotations so the cause is visible in the
            # job summary and the checks API, not only in the raw log.
            echo "$out" | tail -25 | sed 's/^/::error ::seed core data: /'
            exit "$code"
          fi
        env:
          DATABASE_URL: "file:./ci-test.db"
          ADMIN_SEED_EMAIL: "ci-admin@test.local"
          ADMIN_SEED_PASSWORD: "ci-test-password-not-a-real-secret"

      - name: Seed RBAC
        run: |
          set +e
          out=$(bun run prisma:seed:rbac 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "$out" | tail -25 | sed 's/^/::error ::seed rbac: /'
            exit "$code"
          fi
        env:
          DATABASE_URL: "file:./ci-test.db"
          ADMIN_SEED_EMAIL: "ci-admin@test.local"
          ADMIN_SEED_PASSWORD: "ci-test-password-not-a-real-secret"

      # The content gate below refuses to pass on an empty question bank, and
      # nothing in the chain above inserted a question — so CI could never go
      # green. The question seeders are deliberately guarded so that synthetic
      # fixtures can never reach a production database; this step opts into
      # that guard explicitly, against the disposable ci-test.db file only.
      #
      # The seeded content is synthetic and unlicensed: short-form development
      # fixtures used to exercise the grader, the selection logic and the
      # content gate. It is not official or full-length exam material, and it
      # is never loaded in production.
      - name: Seed sample question bank
        run: |
          set +e
          out=$(bun run db:seed:sample-bank 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "$out" | tail -25 | sed 's/^/::error ::seed sample question bank: /'
            exit "$code"
          fi
        env:
          DATABASE_URL: "file:./ci-test.db"
          ALLOW_SYNTHETIC_SAMPLE_QUESTIONS: "1"
          NODE_ENV: "test"
          ADMIN_SEED_EMAIL: "ci-admin@test.local"
          ADMIN_SEED_PASSWORD: "ci-test-password-not-a-real-secret"

      # Content integrity: every selectable objective question must be
      # gradeable, and listening questions without audio are reported. This is
      # the gate `postbuild` deliberately does not enforce (a content gap must
      # not take production down), so CI is where it is binding.
      - name: Validate question content
        run: |
          set +e
          out=$(npm run content:validate 2>&1)
          code=$?
          echo "$out"
          # Publish the summary as annotations so the question-bank numbers are
          # visible in the job summary and the checks API, not only in the log.
          echo "$out" | grep -E 'Content validation:|gradeable|lack audio|✗' | head -20 | sed 's/^/::notice ::content: /'
          exit "$code"
        env:
          DATABASE_URL: "file:./ci-test.db"

      # Run every discovered test file (including the database-backed suites).
      # This step deliberately runs after a content-gate failure so the job
      # reports independent test/build evidence instead of silently skipping it.
      - name: Tests — all suites
        if: always()
        continue-on-error: true
        run: |
          set +e
          bun test tests/ --timeout 30000 2>&1 | tee tests.log
          code=${PIPESTATUS[0]}
          grep -E "^\(fail\)" tests.log | head -30 | sed 's/^/::error ::tests /'
          echo "all=$code" >> test-results.txt
        env:
          DATABASE_URL: "file:./ci-test.db"

      # A single invocation discovers every tests/*.test.ts file, so adding a
      # new suite cannot be silently omitted from a manually maintained list.
      - name: Verify every suite passed
        if: always()
        run: |
          if [ ! -f test-results.txt ]; then
            echo "::error ::no test suite ran: test-results.txt was never created. An earlier setup step failed or was skipped."
            exit 1
          fi
          cat test-results.txt
          if ! grep -qx 'all=0' test-results.txt; then
            echo "::error ::the all-suites test command failed or did not finish successfully"
            exit 1
          fi
          echo "All discovered test files passed."

      - name: Build
        if: always()
        run: bun run build
        env:
          DATABASE_URL: "file::memory:?cache=shared"
          AUTH_SECRET: "ci-test-secret-not-for-production-use-32chars"

      - name: Verify build output
        if: always()
        run: |
          test -f .next/standalone/server.js || { echo "Build output missing"; exit 1; }
          echo "✓ Build output verified"

  # ─── Host-parity build ─────────────────────────────────────────────────
  #
  # The host runs `npm install` then `npm run build` and nothing else. Every
  # other job in this file uses bun and runs `db:generate` as its own explicit
  # step — which is precisely how a missing generate step stayed invisible:
  # CI green, deploy red.
  #
  # This job reproduces the host pipeline, proves the `prebuild` gate recovers a
  # Prisma client that was never generated, and then BOOTS the resulting
  # artifact and asserts it serves a styled page and a health document. A build
  # that produces files is not the same as a deploy that works.
  host-build:
    name: Host-parity build (npm, exactly as the host runs it)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate package manifest
        run: node scripts/check-manifest.mjs

      - name: Install dependencies (host command)
        run: npm install

      # The failure this guards against: `@prisma/client`'s postinstall hook
      # fails silently (npm swallows it and continues), leaving the un-generated
      # stub, and `next build` dies much later during page-data collection with
      # "@prisma/client did not initialize yet". Deleting the generated client
      # reproduces that state exactly and proves `npm run build` repairs it.
      - name: Prove prebuild recovers a missing Prisma client
        run: |
          rm -rf node_modules/.prisma
          npm run prebuild
          test -f node_modules/.prisma/client/schema.prisma || {
            echo "::error ::prebuild did not generate the Prisma client"
            exit 1
          }
          echo "✓ prebuild regenerated the client from scratch"

      - name: Build (host command)
        run: npm run build
        env:
          DATABASE_URL: "file:./ci-host-build.db"
          AUTH_SECRET: "ci-test-secret-not-for-production-use-32chars"

      # `next build` does not copy .next/static, public/ or prisma/ into the
      # standalone output. A build that skipped that step publishes an
      # unstyled, asset-less site while still reporting success.
      - name: Verify the deployment artifact is complete
        run: |
          missing=0
          for f in \
            server.js \
            .next/standalone/server.js \
            .next/standalone/.next/static \
            .next/standalone/public \
            .next/standalone/prisma/schema.prisma \
            .next/standalone/node_modules/.prisma/client/schema.prisma
          do
            if [ -e "$f" ]; then
              echo "✓ $f"
            else
              echo "::error ::deployment artifact is missing $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Provision the database the way production does
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci-host-build.db"

      - name: Boot the artifact and assert it serves traffic
        run: node scripts/smoke-standalone.mjs --timeout 120
        env:
          DATABASE_URL: "file:./ci-host-build.db"
          AUTH_SECRET: "ci-test-secret-not-for-production-use-32chars"

  # ─── Script validation ───────────────────────────────────────────────
  scripts:
    name: Script syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Node scripts
        run: |
          # Every .mjs script is parsed, so a syntax error cannot reach the
          # host. The agent worker and the daily pipeline are included.
          for script in scripts/*.mjs; do
            echo "Checking $script…"
            node --check "$script" || { echo "Syntax error in $script"; exit 1; }
          done
          echo "✓ All Node scripts pass syntax validation"

      - name: Validate bash scripts
        run: |
          # git-push.sh lives at the repository root, not in scripts/, but it is
          # the one script that touches production: it pushes to main, which
          # Hostinger deploys automatically. It is syntax-checked here so it
          # cannot rot between uses.
          for script in scripts/*.sh git-push.sh; do
            echo "Checking $script…"
            bash -n "$script" || { echo "Syntax error in $script"; exit 1; }
          done
          echo "✓ All scripts pass syntax validation"

      - name: Validate systemd service
        run: |
          if command -v systemd-analyze &>/dev/null; then
            systemd-analyze verify server-config/alo-english.service || true
          else
            echo "systemd-analyze not available (non-systemd runner) — skipping"
          fi

      - name: Validate sudoers policy
        run: |
          if command -v visudo &>/dev/null; then
            visudo -c -f server-config/sudo-policy || { echo "Invalid sudoers policy"; exit 1; }
          else
            echo "visudo not available — skipping"
          fi

  # ─── Deployment artifact ─────────────────────────────────────────────
  package:
    name: Create deployment artifact
    needs: [verify, scripts, host-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          mkdir -p dist
          tar -czf dist/alo-english-source.tar.gz \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='*.log' \
            --exclude='*.db' \
            --exclude='.env' \
            --exclude='cpanel-production' \
            --exclude='english-aloeducation' \
            --exclude='skills' \
            --exclude='mini-services' \
            --exclude='examples' \
            --exclude='tool-results' \
            --exclude='upload' \
            --exclude='download' \
            src/ prisma/ public/ scripts/ server-config/ tests/ \
            package.json bun.lock tsconfig.json next.config.ts \
            .env.example .gitignore \
            README.md DEPLOYMENT.md OPERATIONS.md TROUBLESHOOTING.md SECURITY.md CHANGELOG.md

      - name: Generate checksum
        run: |
          cd dist
          sha256sum alo-english-source.tar.gz > alo-english-source.tar.gz.sha256
          cat alo-english-source.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alo-english-source
          path: dist/
          retention-days: 30
