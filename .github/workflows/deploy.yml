# GitHub Actions — CI ONLY (no production deployment from Actions).
#
# Production deployment is handled by Hostinger's automatic Git deployment:
#   GitHub main → Hostinger Node.js Web App → build → migrate → start.
#
# This workflow previously deployed via SSH/PM2 to a VPS at 115.187.18.239.
# That workflow has been retired: Hostinger is the single production authority.
# Do not reintroduce SSH/VPS/PM2 deployment logic — it creates a competing
# deployment pipeline.

name: Deployment notice (Hostinger)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci-info:
    name: CI notice
    runs-on: ubuntu-latest
    steps:
      - name: Production deployment notice
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  Production is deployed via Hostinger automatic"
          echo "  Git deployment from the main branch."
          echo ""
          echo "  Domain: https://english.aloeducation.com"
          echo "  This GitHub Actions workflow is CI-only — it does"
          echo "  not push to production. Push to main and Hostinger"
          echo "  will build, migrate, and restart automatically."
          echo "═══════════════════════════════════════════════════════"
