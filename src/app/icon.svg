<?xml version="1.0" encoding="utf-8"?>
<!--
  src/app/icon.svg — the application icon (Next.js file convention).

  The site previously had no icon at all: `src/proxy.ts` lists `/favicon.ico`
  as a public route, but no favicon file existed, so every page load produced a
  404 for it. Next.js serves this file automatically and adds the matching
  <link rel="icon"> tag to the document head.

  The mark is the same "A" as public/logo.svg, without the animation, so it
  renders identically in a browser tab, a bookmark and a home-screen shortcut.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ALO Education">
  <rect x="1" y="1" width="30" height="30" rx="4" fill="#2D2D2D" stroke="#FFFFFF" stroke-width="0.6" />
  <g fill="#FFFFFF">
    <path d="M16.4 6.6 14.9 8.7c-.2.3-.6.5-1 .5H6.2V6.6h10.2z" />
    <polygon points="25.3,6.6 13.3,25.4 5,25.4 17,6.6" />
    <path d="m15.4 25.4 1.5-2.1c.2-.3.6-.5 1-.5h7.4v2.6H15.4z" />
  </g>
</svg>
