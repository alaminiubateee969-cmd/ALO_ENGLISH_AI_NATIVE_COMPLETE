# =====================================================================
# ALO English Test Platform — OpenLiteSpeed / CyberPanel Rewrite Rules
# ---------------------------------------------------------------------
# This file contains the rewrite rules for OpenLiteSpeed.
# In CyberPanel: Websites → english.aloeducation.com → Rewrite Rules
# Paste the contents of the "REWRITE RULES" section below.
#
# IMPORTANT: OpenLiteSpeed does NOT use .htaccess for rewrite rules.
# Rewrite rules must be entered via CyberPanel admin or vhost config.
# =====================================================================

# ---------- REWRITE RULES (paste into CyberPanel → Rewrite Rules) ----------

# Force HTTPS (if not already handled by CyberPanel SSL settings)
RewriteCond %{HTTPS} !=on
RewriteCond %{HTTP:X-Forwarded-Proto} !=https
RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

# Route all non-file, non-directory requests to index.php (front controller)
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^ index.php [QSA,L]

# Block sensitive files
RewriteRule ^\.env$ - [F,L]
RewriteRule ^\.env\..*$ - [F,L]
RewriteRule ^\.git/ - [F,L]
RewriteRule ^composer\.(json|lock)$ - [F,L]
RewriteRule ^package\.json$ - [F,L]
RewriteRule ^database/.*\.sql$ - [F,L]
RewriteRule ^logs/ - [F,L]
RewriteRule ^storage/private/ - [F,L]
RewriteRule ^scripts/ - [F,L]
RewriteRule ^cron/ - [F,L]
RewriteRule ^reports/ - [F,L]
RewriteRule ^docs/ - [F,L]
RewriteRule ^config/ - [F,L]

# Block PHP execution in uploads/storage
RewriteRule ^storage/.*\.php$ - [F,L]
RewriteRule ^public/.*\.php$ - [F,L]

# ---------- END REWRITE RULES ----------

# =====================================================================
# CYBERPANEL VHOST CONTEXT CONFIGURATION
# ---------------------------------------------------------------------
# In addition to rewrite rules, add these Context entries in
# CyberPanel → Websites → english.aloeducation.com → Context:
#
# 1. Block /storage/private/:
#    Type: Static
#    URI: /storage/private/
#    Path: $VH_ROOT/storage/private/
#    Access: Denied
#
# 2. Block /database/:
#    Type: Static
#    URI: /database/
#    Path: $VH_ROOT/database/
#    Access: Denied
#
# 3. Block /logs/:
#    Type: Static
#    URI: /logs/
#    Path: $VH_ROOT/logs/
#    Access: Denied
#
# 4. Block /config/:
#    Type: Static
#    URI: /config/
#    Path: $VH_ROOT/config/
#    Access: Denied
#
# 5. Block /.env:
#    Type: Static
#    URI: /.env
#    Path: $VH_ROOT/.env
#    Access: Denied
# =====================================================================

# =====================================================================
# SECURITY HEADERS (add via CyberPanel → Context → Header Operations)
# ---------------------------------------------------------------------
# Add these headers in the vhost configuration:
#
# Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
# X-Frame-Options "SAMEORIGIN"
# X-Content-Type-Options "nosniff"
# X-XSS-Protection "1; mode=block"
# Referrer-Policy "strict-origin-when-cross-origin"
# Permissions-Policy "geolocation=(), microphone=(), camera=()"
# =====================================================================
