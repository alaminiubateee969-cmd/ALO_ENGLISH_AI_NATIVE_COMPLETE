# deploy/nginx-english.aloeducation.com.conf
#
# Nginx site for english.aloeducation.com on alo-server-lap (103.231.239.79).
#
# Install:
#   sudo cp deploy/nginx-english.aloeducation.com.conf /etc/nginx/sites-available/english.aloeducation.com
#   sudo ln -sf /etc/nginx/sites-available/english.aloeducation.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare note: the site currently runs behind Cloudflare with "Flexible"
# SSL. Nginx therefore listens on :80 only. When the certificate is upgraded
# to Full/Strict (recommended), add the 443 server block from the comment at
# the bottom and issue a Let's Encrypt certificate with certbot.

server {
    listen 80;
    server_name english.aloeducation.com;

    # Uploads/exports can be large (student documents); keep Next.js's own
    # body limits as the application-level guard.
    client_max_body_size 12m;

    # Gzip is handled by the Next.js server (compress: true); do not
    # double-compress. Static assets are served immutable by the app.

    location / {
        proxy_pass http://127.0.0.1:3055;
        proxy_http_version 1.1;

        # Server-sent events / hot reload support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS while it is in Flexible mode; pass the
        # original scheme through so generated URLs are correct.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s; # long exam submissions
    }

    # The health probe the monitoring stack should watch.
    location = /api/health {
        proxy_pass http://127.0.0.1:3055;
        access_log off;
    }
}

# ── When Cloudflare SSL is upgraded to Full/Strict, add: ──────────────────
# server {
#     listen 443 ssl http2;
#     server_name english.aloeducation.com;
#     ssl_certificate     /etc/letsencrypt/live/english.aloeducation.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/english.aloeducation.com/privkey.pem;
#     ...same locations as above...
# }
