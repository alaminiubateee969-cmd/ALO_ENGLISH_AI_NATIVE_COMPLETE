# ============================================================
# Nginx reverse proxy for english.aloeducation.com
# Forwards to the Next.js standalone server on 127.0.0.1:3002.
#
# Install:
#   sudo cp nginx/english-aloeducation.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/english-aloeducation.conf \
#              /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d english.aloeducation.com
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Rate-limit zone for the login / register endpoints (prevent brute force).
limit_req_zone $binary_remote_addr zone=alo_auth:10m rate=10r/m;

# Upstream definition.
upstream english_aloeducation_app {
    server 127.0.0.1:3002;
    keepalive 32;
}

# ---- HTTP → HTTPS redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name english.aloeducation.com;

    # ACME challenge passthrough.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS server ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name english.aloeducation.com;

    # ---- SSL (Let's Encrypt) ----
    ssl_certificate     /etc/letsencrypt/live/english.aloeducation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.aloeducation.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:alo_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' blob:; frame-ancestors 'self';" always;

    # ---- Upload size (audio recordings for speaking tests) ----
    client_max_body_size 50M;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Static file uploads (served directly by nginx) ----
    location /uploads/ {
        alias /var/www/english-aloeducation/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Next.js static assets (long cache) ----
    location /_next/static/ {
        proxy_pass http://english_aloeducation_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Next.js image optimizer ----
    location /_next/image {
        proxy_pass http://english_aloeducation_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
    }

    # ---- Auth endpoints (rate-limited) ----
    location ~ ^/(login|register|api/auth) {
        limit_req zone=alo_auth burst=20 nodelay;
        proxy_pass http://english_aloeducation_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Main application reverse proxy ----
    location / {
        proxy_pass http://english_aloeducation_app;
        proxy_http_version 1.1;

        # WebSocket upgrade (used for Next.js HMR in dev & future live features).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests (exam submission, AI eval).
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering off for streaming responses.
        proxy_buffering off;
    }

    # ---- Robots & favicon ----
    location = /robots.txt {
        proxy_pass http://english_aloeducation_app;
        access_log off;
    }
    location = /favicon.ico {
        proxy_pass http://english_aloeducation_app;
        access_log off;
        log_not_found off;
    }

    # ---- Hide sensitive dotfiles ----
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
